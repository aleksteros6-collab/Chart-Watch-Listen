    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
            color: #e0e7ff;
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(20, 30, 60, 0.85);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
            border: 1px solid #3b82f6;
        }
        h1 {
            text-align: center;
            font-size: 2.4em;
            margin: 0 0 10px;
            color: #60a5fa;
            text-shadow: 0 0 15px rgba(96, 165, 250, 0.6);
        }
        .subtitle {
            text-align: center;
            font-size: 1.2em;
            color: #93c5fd;
            margin-bottom: 40px;
        }
        .track-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(30, 58, 138, 0.5);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-left: 5px solid transparent;
            transition: all 0.25s ease;
        }
        .track-card:hover {
            background: rgba(59, 130, 246, 0.35);
            border-left: 5px solid #60a5fa;
            transform: translateX(6px);
        }
        .cover {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
            background: #1e40af;
            flex-shrink: 0;
        }
        .info {
            flex-grow: 1;
        }
        .track-name {
            font-size: 1.15em;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .artist-name {
            color: #bfdbfe;
            font-size: 0.95em;
        }
        .vote-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95em;
            transition: 0.2s;
            white-space: nowrap;
        }
        .vote-btn:hover {
            background: #60a5fa;
            transform: scale(1.05);
        }
        .vote-btn.voted {
            background: #1e40af;
            cursor: default;
            transform: none;
        }
        .note {
            text-align: center;
            color: #93c5fd;
            font-size: 0.95em;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>

    ];

    const list = document.getElementById('tracks-list');

    tracks.forEach(track => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.innerHTML = `
            <img src="https://via.placeholder.com/65/1e40af/ffffff?text=♪" class="cover" alt="${track.title}">
            <div class="info">
                <div class="track-name">${track.title}</div>
                <div class="artist-name">${track.artist}</div>
            </div>
            <button class="vote-btn" data-id="${track.id}">Голосовать</button>
        `;
        list.appendChild(card);
    });

    // Обработка голосования
    document.querySelectorAll('.vote-btn').forEach(btn => {
        const trackId = btn.getAttribute('data-id');
        const storageKey = 'voted_' + trackId;

        // Проверяем, голосовал ли уже этот браузер
        if (localStorage.getItem(storageKey)) {
            btn.textContent = 'Голос учтён!';
            btn.classList.add('voted');
            btn.disabled = true;
        }

        btn.addEventListener('click', () => {
            if (btn.classList.contains('voted')) return;

            // Записываем голос в Firebase
            db.ref('votes/' + trackId).transaction(current => (current || 0) + 1);

            // Помечаем, что этот браузер уже голосовал
            localStorage.setItem(storageKey, 'true');

            btn.textContent = 'Голос учтён!';
            btn.classList.add('voted');
            btn.disabled = true;
        });
    });
